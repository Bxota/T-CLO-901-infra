---
# Re-creates the Sealed Secrets controller key from the Ansible-Vault-encrypted
# backup so a rebuilt cluster can decrypt every SealedSecret committed before
# the rebuild. Run on kube-1 with:  ansible-playbook ~/sealed-secrets-restore.yml --vault-id sealed@prompt
# Preferred order: after agent.yml on the workers, BEFORE argocd-bootstrap.yml,
# so the controller finds this key at its first start and never generates one.
# Running it later still works: the play restarts a running controller, which
# then decrypts with the restored key and keeps the newer key for new seals.
- hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Remove a stale root-owned checkout from a previous run
      ansible.builtin.file:
        path: /tmp/T-CLO-901-infra-secrets
        state: absent

    - name: Clone the infra repo for the encrypted key backup
      # become: false — lookup() plugins below execute on the controller as the
      # invoking user (ssm-user), never under become, so the checkout must stay
      # owned by that user or the lookup gets a silent (no_log) permission denied.
      ansible.builtin.git:
        repo: https://github.com/Bxota/T-CLO-901-infra.git
        dest: /tmp/T-CLO-901-infra-secrets
        version: main
        force: true
      become: false

    - name: Read the backup name so the check below targets the exact Secret
      ansible.builtin.set_fact:
        sealed_key_backup: "{{ lookup('ansible.builtin.file', '/tmp/T-CLO-901-infra-secrets/playbooks/files/sealed-secrets-key.vault.yaml') | from_json }}"
      no_log: true

    - name: Check whether the backed-up key Secret already exists
      ansible.builtin.command: >
        k3s kubectl -n kube-system get secret {{ sealed_key_backup['items'][0]['metadata']['name'] }}
      register: sealed_key_present
      failed_when: false
      changed_when: false

    - name: Write the decrypted key to a root-only temporary file
      ansible.builtin.copy:
        content: "{{ sealed_key_backup | to_nice_json }}"
        dest: /tmp/sealed-secrets-key.json
        mode: "0600"
      when: sealed_key_present.rc != 0
      no_log: true

    - name: Re-create the controller key Secret
      ansible.builtin.command: k3s kubectl apply -f /tmp/sealed-secrets-key.json
      when: sealed_key_present.rc != 0

    - name: Shred the decrypted key file
      ansible.builtin.command: shred -u /tmp/sealed-secrets-key.json
      when: sealed_key_present.rc != 0

    - name: Check whether the controller is already running
      ansible.builtin.command: k3s kubectl -n kube-system get deployment sealed-secrets-controller
      register: controller_present
      failed_when: false
      changed_when: false

    - name: Restart the controller so it loads the restored key
      ansible.builtin.command: k3s kubectl -n kube-system rollout restart deployment/sealed-secrets-controller
      when: sealed_key_present.rc != 0 and controller_present.rc == 0

    - name: Report
      ansible.builtin.debug:
        msg: "{{ 'Key restored' if sealed_key_present.rc != 0 else 'Key already present, nothing to do' }} ({{ sealed_key_backup['items'][0]['metadata']['name'] }})"
