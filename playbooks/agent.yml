---
- hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Install k3s agent and join the cluster
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | \
          K3S_URL=https://{{ k3s_server_ip }}:6443 \
          K3S_TOKEN={{ k3s_token }} \
          sh -s -
      args:
        creates: /etc/systemd/system/k3s-agent.service
