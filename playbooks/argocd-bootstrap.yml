---
- hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Check whether the argocd namespace already exists
      ansible.builtin.command: k3s kubectl get namespace argocd
      register: argocd_ns
      failed_when: false
      changed_when: false

    - name: Create the argocd namespace
      ansible.builtin.command: k3s kubectl create namespace argocd
      when: argocd_ns.rc != 0

    - name: Install Argo CD (stable upstream manifest)
      ansible.builtin.command: >
        k3s kubectl apply -n argocd --server-side --force-conflicts
        -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
      when: argocd_ns.rc != 0

    - name: Wait for the argocd-server deployment to become available
      ansible.builtin.command: >
        k3s kubectl -n argocd wait --for=condition=available
        --timeout=300s deployment/argocd-server
      changed_when: false

    - name: Clone the infra repo for its own Argo CD Application manifests
      ansible.builtin.git:
        repo: https://github.com/Bxota/T-CLO-901-infra.git
        dest: /tmp/T-CLO-901-infra-bootstrap
        version: main
        force: true

    - name: Retire the legacy app owner without deleting workloads
      ansible.builtin.command: >
        k3s kubectl -n argocd delete application app
        --cascade=orphan --ignore-not-found=true

    - name: Apply the root Argo CD Application
      ansible.builtin.command: k3s kubectl apply -f /tmp/T-CLO-901-infra-bootstrap/argocd/apps/root.yaml

    - name: Check current argocd-server insecure setting
      ansible.builtin.shell: >
        k3s kubectl -n argocd get configmap argocd-cmd-params-cm -o json
        | grep -o '"server.insecure":"true"' || true
      register: argocd_insecure_setting
      changed_when: false

    - name: Configure argocd-server to serve plain HTTP (TLS is terminated at the Gateway)
      ansible.builtin.command: >
        k3s kubectl -n argocd patch configmap argocd-cmd-params-cm
        --type merge -p '{"data":{"server.insecure":"true"}}'
      when: argocd_insecure_setting.stdout == ""

    - name: Restart argocd-server to pick up the insecure setting
      ansible.builtin.command: k3s kubectl -n argocd rollout restart deployment argocd-server
      when: argocd_insecure_setting.stdout == ""
