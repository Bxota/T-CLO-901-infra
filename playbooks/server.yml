---
- hosts: localhost
  connection: local
  become: true
  tasks:
    - name: Install k3s server
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -s - server \
          --disable traefik \
          --disable servicelb \
          --node-taint node-role.kubernetes.io/control-plane:NoSchedule \
          --service-node-port-range=80-32767 \
          --kube-apiserver-arg=oidc-issuer-url=https://dex.15.224.195.86.sslip.io \
          --kube-apiserver-arg=oidc-client-id=kubernetes \
          --kube-apiserver-arg=oidc-username-claim=email \
          --kube-apiserver-arg=oidc-username-prefix=oidc: \
          --kube-apiserver-arg=oidc-groups-claim=groups \
          --kube-apiserver-arg=oidc-groups-prefix=oidc:
      args:
        creates: /usr/local/bin/k3s

    - name: Fetch the node join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: join_token

    - name: Print private IP and join token for the agents
      ansible.builtin.debug:
        msg:
          - "PRIVATE_IP={{ ansible_default_ipv4.address }}"
          - "TOKEN={{ join_token.content | b64decode | trim }}"
