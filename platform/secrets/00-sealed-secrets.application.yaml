apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    # Namespaces come first (wave -3). The sealed-secrets controller and its
    # CRD must then be installed and Healthy at wave -2, before the
    # SealedSecrets in platform/identity/sealed (wave -1) can be decrypted:
    # those SealedSecrets create the Secrets that Keycloak (wave 0) and Dex
    # (wave 1) mount. Waving the controller any later than the SealedSecrets
    # it must decrypt would deadlock a fresh sync.
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets
    targetRevision: 2.20.0
    helm:
      releaseName: sealed-secrets
      values: |
        # kubeseal's defaults are controller name sealed-secrets-controller in
        # namespace kube-system; matching them removes two flags from every
        # sealing command.
        fullnameOverride: sealed-secrets-controller
        image:
          registry: docker.io
          repository: bitnami/sealed-secrets-controller
          tag: 0.40.0
        # One key pair for the life of the cluster: the backup in
        # playbooks/files/sealed-secrets-key.vault.yaml is the whole key set.
        keyrenewperiod: "0"
        secretName: sealed-secrets-key
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
