---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: headlamp-dex-client
  namespace: headlamp
  annotations:
    # After wave 2 (platform/observability/00-namespaces.yaml creates the
    # headlamp namespace this secret targets), before wave 3 (the headlamp
    # Application that mounts it via config.oidc.externalSecret).
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  encryptedData:
    OIDC_CLIENT_ID: 
    OIDC_CLIENT_SECRET: 
    OIDC_ISSUER_URL: 
    OIDC_SCOPES: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
      name: headlamp-dex-client
      namespace: headlamp
    type: Opaque
