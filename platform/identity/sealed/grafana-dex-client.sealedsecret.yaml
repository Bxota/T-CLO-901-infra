---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-dex-client
  namespace: monitoring
  annotations:
    # After wave 2 (platform/observability/00-namespaces.yaml creates the
    # monitoring namespace this secret targets), before wave 3 (the
    # kube-prometheus-stack Application that mounts it via envValueFrom).
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  encryptedData:
    clientID: 
    clientSecret: 
  template:
    metadata:
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
      name: grafana-dex-client
      namespace: monitoring
    type: Opaque
