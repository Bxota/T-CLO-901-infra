apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-namespace-guardrails
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: only-application-namespaces
      expression: "object.metadata.namespace in ['app', 'app-stage']"
  validations:
    - expression: "has(object.metadata.labels) && 'app.kubernetes.io/name' in object.metadata.labels"
      message: "Pods in application namespaces must carry the 'app.kubernetes.io/name' label."
    - expression: "object.spec.containers.all(c, has(c.resources) && has(c.resources.requests) && has(c.resources.limits))"
      message: "Every container in application namespaces must declare resource requests and limits."
    - expression: "object.spec.containers.all(c, c.image.startsWith('ghcr.io/bxota/'))"
      message: "Container images in application namespaces must come from ghcr.io/bxota/ (the approved private registry)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: app-namespace-guardrails-binding
spec:
  policyName: app-namespace-guardrails
  validationActions: ["Deny"]
