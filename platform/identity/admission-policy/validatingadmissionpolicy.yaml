apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: app-namespace-guardrails
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchConditions:
    - name: only-app-namespace
      expression: "object.metadata.namespace == 'app'"
  validations:
    - expression: "has(object.metadata.labels) && 'app.kubernetes.io/name' in object.metadata.labels"
      message: "Pods in the app namespace must carry the 'app.kubernetes.io/name' label."
    - expression: "object.spec.containers.all(c, has(c.resources) && has(c.resources.requests) && has(c.resources.limits))"
      message: "Every container in the app namespace must declare resource requests and limits."
    - expression: "object.spec.containers.all(c, c.image.startsWith('ghcr.io/bxota/'))"
      message: "Container images in the app namespace must come from ghcr.io/bxota/ (the approved private registry)."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: app-namespace-guardrails-binding
spec:
  policyName: app-namespace-guardrails
  validationActions: ["Deny"]
