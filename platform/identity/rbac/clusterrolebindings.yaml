# platform-admin keeps cluster-admin. developer and viewer no longer get a
# cluster-wide edit/view: their rights are namespace Roles (see
# namespace-roles.yaml) plus the minimal cluster read below, which keeps
# Headlamp and kubectl usable (namespace and node listing).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-platform-admin
subjects:
  - kind: Group
    name: "oidc:platform-admin"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oidc-cluster-read-basics
rules:
  - apiGroups: [""]
    resources: ["namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-cluster-read-basics
subjects:
  - kind: Group
    name: "oidc:developer"
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: "oidc:viewer"
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: oidc-cluster-read-basics
  apiGroup: rbac.authorization.k8s.io
