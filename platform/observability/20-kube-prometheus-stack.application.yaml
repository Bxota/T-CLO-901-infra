apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.4.1
    helm:
      releaseName: kube-prometheus-stack
      values: |
        # Provisional until the firing-alert survey (Task 7 step 2) is run on the cluster.
        defaultRules:
          disabled:
            KubeCPUOvercommit: true
            KubeMemoryOvercommit: true
            CPUThrottlingHigh: true
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        kubeEtcd:
          enabled: false
        prometheus:
          prometheusSpec:
            nodeSelector:
              node-role.kubernetes.io/control-plane: "true"
            tolerations:
              - key: node-role.kubernetes.io/control-plane
                operator: Exists
                effect: NoSchedule
            retention: 15d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: ["ReadWriteOnce"]
                  resources:
                    requests:
                      storage: 20Gi
            # Select every monitor and rule in the cluster, not only those
            # labelled release=kube-prometheus-stack: the app chart and the
            # platform manifests own their own monitors.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
        kube-state-metrics:
          # Exposes kube_pod_labels{label_app_kubernetes_io_version} so
          # dashboards can show the deployed app version per namespace.
          metricLabelsAllowlist:
            - pods=[app.kubernetes.io/version]
        alertmanager:
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: "null"
              group_by: ["alertname", "env", "namespace"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              routes:
                - receiver: "null"
                  matchers:
                    - severity = "critical"
                - receiver: "null"
                  matchers:
                    - severity = "warning"
            receivers:
              - name: "null"
        grafana:
          sidecar:
            dashboards:
              folderAnnotation: grafana_folder
              provider:
                foldersFromFilesStructure: true
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki.monitoring.svc.cluster.local:3100
              isDefault: false
            - name: Alertmanager
              uid: alertmanager
              type: alertmanager
              access: proxy
              url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
              isDefault: false
              jsonData:
                implementation: prometheus
                handleGrafanaManagedAlerts: false
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_ID:
              secretKeyRef:
                name: grafana-dex-client
                key: clientID
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-dex-client
                key: clientSecret
          grafana.ini:
            server:
              root_url: https://grafana.15.224.195.86.sslip.io
            auth:
              disable_login_form: true
            auth.generic_oauth:
              enabled: true
              name: Dex
              allow_sign_up: true
              scopes: "openid email groups"
              auth_url: https://dex.15.224.195.86.sslip.io/auth
              token_url: https://dex.15.224.195.86.sslip.io/token
              api_url: https://dex.15.224.195.86.sslip.io/userinfo
              role_attribute_path: "contains(groups[*], 'platform-admin') && 'GrafanaAdmin' || contains(groups[*], 'developer') && 'Editor' || 'Viewer'"
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
