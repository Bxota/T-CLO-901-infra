apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubequest-node-memory
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: kubequest.node-memory
      rules:
        - alert: KubeQuestNodeMemoryHeadroomLow
          expr: |
            (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.20)
              * on (instance) group_left (nodename) node_uname_info
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: 'Less than 20% memory available on {{ $labels.nodename }} for 15 minutes'
            runbook_url: https://github.com/Bxota/T-CLO-901-infra/blob/main/docs/runbooks/worker-memory.md
