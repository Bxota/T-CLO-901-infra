apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - 00-namespaces.yaml
  - 05-efs-bootstrap-loki.job.yaml
  - 10-loki-pv.yaml
  - 20-kube-prometheus-stack.application.yaml
  - 30-loki.application.yaml
  - 40-alloy.application.yaml
  - 50-headlamp.application.yaml
  - 60-routes.yaml
  - 70-alert-rules.yaml
  - 80-servicemonitors.yaml
  - 81-envoy-podmonitor.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: KubeQuest
configMapGenerator:
  - name: dashboard-app-overview
    namespace: monitoring
    files:
      - app-overview.json=dashboards/app-overview.json
  - name: dashboard-platform-health
    namespace: monitoring
    files:
      - platform-health.json=dashboards/platform-health.json
