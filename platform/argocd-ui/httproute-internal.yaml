apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server-internal
  namespace: argocd
spec:
  parentRefs:
    - name: internal-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - argocd.bxota.com
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
