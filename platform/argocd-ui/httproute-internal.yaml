apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-server-internal
  namespace: argocd
  annotations:
    # After internal-gateway (wave 1): Argo CD waits for each wave to be
    # healthy, and a route whose Gateway does not exist yet never is.
    argocd.argoproj.io/sync-wave: "4"
spec:
  parentRefs:
    - name: internal-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - argocd.bxota.com
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
