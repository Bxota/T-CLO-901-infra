---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ionos-secret
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  encryptedData:
    IONOS_PUBLIC_PREFIX: 
    IONOS_SECRET: 
  template:
    metadata:
      name: ionos-secret
      namespace: cert-manager
    type: Opaque
