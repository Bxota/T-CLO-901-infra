apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: app-certificate
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    networking.kubequest2.io/certificate: public
spec:
  secretName: app-tls
  dnsNames:
    - app.bxota.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-staging
---
# Every internal hostname, served only by internal-gateway. The label name
# predates this certificate: the production overlay patches every
# Certificate carrying it to letsencrypt-production.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal-certificate
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  labels:
    networking.kubequest2.io/certificate: public
spec:
  secretName: internal-tls
  dnsNames:
    - grafana.bxota.com
    - argocd.bxota.com
    - headlamp.bxota.com
    - dex.bxota.com
    - keycloak.bxota.com
    - app-stage.bxota.com
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt-staging
