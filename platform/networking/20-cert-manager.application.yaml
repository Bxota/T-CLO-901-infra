apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: quay.io/jetstack/charts
    chart: cert-manager
    targetRevision: v1.21.2
    helm:
      releaseName: cert-manager
      values: |
        crds:
          enabled: true
        # DNS-01 propagation checks ask public resolvers directly, not the
        # VPC resolver, which may cache the NXDOMAIN of a fresh TXT record.
        extraArgs:
          - --dns01-recursive-nameservers-only
          - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
        config:
          gatewayAPI:
            enabled: true
        prometheus:
          enabled: true
          servicemonitor:
            enabled: true
            namespace: cert-manager
            interval: 60s
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
