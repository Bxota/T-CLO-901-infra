apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/bxota/charts
    chart: laravel
    targetRevision: ">=1.0.0"
    helm:
      # The legacy Application/app deployed this chart with release name
      # "app"; selectors carry app.kubernetes.io/instance and are immutable.
      releaseName: app
      valuesObject:
        replicaCount: 2
        route:
          host: app.15.224.195.86.sslip.io
        efs: {enabled: true}
        backup: {enabled: true}
        mysql:
          primary:
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi
            persistence:
              selector:
                matchLabels: {app.kubernetes.io/component: mysql-data}
        sealedSecrets:
          mysqlCredentials:
            encryptedData: {app-key: , mysql-password: , mysql-root-password: }
          ghcrPullSecret:
            encryptedData: {'.dockerconfigjson': }
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
