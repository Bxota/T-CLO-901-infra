apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-stage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/bxota/charts
    chart: laravel
    targetRevision: ">=1.0.0-0"
    helm:
      valuesObject:
        replicaCount: 1
        route:
          host: app-stage.15.224.195.86.sslip.io
        env:
          APP_URL: https://app-stage.15.224.195.86.sslip.io
        efs:
          enabled: false
        backup:
          enabled: false
        mysql:
          primary:
            persistence:
              storageClass: local-path
              # null does not reliably drop the subchart default through Argo
              # CD's Helm; an empty map is falsy for the template's "if".
              selector: {}
        sealedSecrets:
          mysqlCredentials:
            encryptedData: {app-key: , mysql-password: , mysql-root-password: }
          ghcrPullSecret:
            encryptedData: {'.dockerconfigjson': }
  destination:
    server: https://kubernetes.default.svc
    namespace: app-stage
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
