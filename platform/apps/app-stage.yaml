apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-stage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ghcr.io/bxota/charts
    chart: laravel
    targetRevision: ">=1.0.0-0"
    helm:
      valuesObject:
        replicaCount: 1
        route:
          host: app-stage.bxota.com
          gateway:
            name: internal-gateway
            namespace: envoy-gateway-system
            sectionName: https
        env:
          APP_URL: https://app-stage.bxota.com
          APP_DEPLOY_ENV: staging
        efs:
          enabled: false
        backup:
          enabled: false
        mysql:
          primary:
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 1Gi
            persistence:
              storageClass: local-path
        sealedSecrets:
          mysqlCredentials:
            encryptedData: {app-key: , mysql-password: , mysql-root-password: }
          ghcrPullSecret:
            encryptedData: {'.dockerconfigjson': }
  destination:
    server: https://kubernetes.default.svc
    namespace: app-stage
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
