name: Pin platform release

on:
  push:
    tags: ['v*']

concurrency:
  group: pin-main
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Pin platform Application
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            sed -i -E "0,/^    targetRevision: v[0-9]+\.[0-9]+\.[0-9]+$/s//    targetRevision: ${RELEASE_TAG}/" platform/apps/platform.yaml
            grep -q "^    targetRevision: ${RELEASE_TAG}$" platform/apps/platform.yaml
            git add platform/apps/platform.yaml
            if git diff --cached --quiet; then
              echo "platform already pinned to ${RELEASE_TAG}"
              exit 0
            fi
            git commit -m "chore: pin platform to ${RELEASE_TAG}"
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
